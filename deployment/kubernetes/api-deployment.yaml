apiVersion: apps/v1
kind: Deployment
metadata:
  name: corridor-api
  labels:
    app: corridor-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: corridor-api
  template:
    metadata:
      labels:
        app: corridor-api
    spec:
      containers:
      - name: api
        image: corridor/api:latest
        ports:
        - containerPort: 8000
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: corridor-secrets
              key: database-url
        - name: REDIS_URL
          value: "redis://redis-service:6379/0"
        - name: PAYSTACK_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: corridor-secrets
              key: paystack-secret
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: corridor-api-service
spec:
  selector:
    app: corridor-api
  ports:
  - protocol: TCP
    port: 8000
    targetPort: 8000
  type: ClusterIP