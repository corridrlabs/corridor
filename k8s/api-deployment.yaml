apiVersion: apps/v1
kind: Deployment
metadata:
  name: corridor-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: corridor-api
  template:
    metadata:
      labels:
        app: corridor-api
    spec:
      containers:
      - name: corridor-api
        image: ghcr.io/your-org/corridor-api:latest
        ports:
        - containerPort: 8000
        envFrom:
        - secretRef:
            name: corridor-secrets
        - configMapRef:
            name: corridor-config
        readinessProbe:
          httpGet:
            path: /api/auth/check # Using an existing endpoint as health check
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /api/auth/check
            port: 8000
          initialDelaySeconds: 15
          periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: corridor-api
spec:
  selector:
    app: corridor-api
  ports:
  - protocol: TCP
    port: 80
    targetPort: 8000
  type: ClusterIP
